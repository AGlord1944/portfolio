<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Артем Озеров — Портфолио</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-cream: #F4F1EA;
      --mc-mustard: #DDA74F;
      --mc-olive: #687259;
      --mc-blue: #2A3D4F;
      --mc-terracotta: #C36B58;
      --text-dark: #2A2A2A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { background-color: var(--bg-cream); color: var(--text-dark); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
    h1, h2, h3, h4 { font-family: 'Playfair Display', serif; color: var(--mc-blue); }

    .background-pattern {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
      background-image: radial-gradient(var(--mc-mustard) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.15;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Главный экран */
    .hero { display: flex; align-items: center; justify-content: space-between; min-height: 100vh; padding: 100px 0 60px 0; gap: 60px; flex-wrap: wrap; }
    .hero-text { flex: 1.2; min-width: 320px; }
    .hero-text h1 { font-size: 5rem; line-height: 1.05; margin-bottom: 25px; letter-spacing: -1px; }
    .hero-text p { font-size: 1.2rem; color: var(--mc-olive); margin-bottom: 30px; line-height: 1.7; max-width: 500px; }
    .hero-images { position: relative; flex: 1; min-width: 320px; height: 500px; display: flex; justify-content: center; align-items: center; }

    .arch-backdrop { position: absolute; width: 280px; height: 400px; background-color: var(--mc-terracotta); border-radius: 140px 140px 0 0; transform: translate(25px, 25px); z-index: 1; }
    .photo-arch { position: relative; width: 280px; height: 400px; object-fit: cover; border-radius: 140px 140px 0 0; z-index: 2; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); animation: float 6s ease-in-out infinite; }

    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }

    /* Сетка проектов и Карточки с переворотом */
    .portfolio { padding: 80px 0; }
    .section-title { font-size: 3.5rem; margin-bottom: 60px; border-bottom: 2px solid var(--mc-blue); padding-bottom: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 40px; }
    
    /* Обертка карточки - задает перспективу */
    .card {
      perspective: 1500px;
      height: 520px; /* Фиксированная высота для переворота */
      cursor: pointer;
    }
    
    /* Внутренняя часть, которая вращается */
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    /* Эффект увеличения ПРИ НАВЕДЕНИИ на ПК */
    @media (hover: hover) {
      .card:hover .card-inner { box-shadow: 0 20px 40px rgba(42, 61, 79, 0.15); }
      .card:hover:not(.is-flipped) .card-inner { transform: scale(1.04); }
      /* Если карточка перевернута и мы наводим мышь - она тоже увеличивается */
      .card.is-flipped:hover .card-inner { transform: rotateY(180deg) scale(1.04); }
    }

    /* Класс, который добавляется скриптом при клике */
    .card.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    /* Лицевая и Обратная стороны */
    .card-front, .card-back {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      backface-visibility: hidden; /* Прячем заднюю часть при вращении */
      border-radius: 12px; overflow: hidden; background: #fff;
    }

    /* Стили Лицевой стороны */
    .card-front { display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.05); }
    .card-image { width: 100%; height: 260px; object-fit: cover; border-bottom: 6px solid var(--mc-mustard); flex-shrink: 0; }
    .card-content { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-content h3 { font-size: 1.6rem; margin-bottom: 10px; }
    .card-content p { font-size: 0.95rem; line-height: 1.5; color: #555; margin-bottom: 15px; }
    .flip-hint { margin-top: auto; font-size: 0.85rem; color: var(--mc-terracotta); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    /* Стили Обратной стороны */
    .card-back {
      transform: rotateY(180deg); /* Изначально развернута на 180 градусов */
      background-color: var(--bg-cream);
      border: 4px solid var(--mc-mustard);
      padding: 30px; display: flex; flex-direction: column; overflow-y: auto;
    }
    .card-back h4 { font-size: 1.5rem; margin-bottom: 15px; }
    .card-back p { font-size: 0.95rem; line-height: 1.6; color: #444; }
    
    .extra-images { display: flex; gap: 10px; margin-top: auto; padding-top: 20px;}
    .extra-images img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    /* Подвал */
    footer { background-color: var(--mc-blue); color: var(--bg-cream); padding: 80px 20px; margin-top: 60px; }
    .footer-content { max-width: 1200px; margin: 0 auto; text-align: center; }
    footer h2 { color: var(--mc-mustard); margin-bottom: 30px; font-size: 2.5rem; }
    .social-links { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .social-links a { text-decoration: none; color: var(--mc-blue); font-weight: 600; padding: 15px 35px; background-color: var(--mc-mustard); border-radius: 30px; transition: all 0.3s; }
    .social-links a:hover { background-color: var(--bg-cream); transform: translateY(-3px); }

    .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .hero-text h1 { font-size: 3.5rem; } .section-title { font-size: 2.5rem; }
      .hero { padding: 60px 0; justify-content: center; text-align: center; }
      .hero-text p { margin: 0 auto 30px auto; } .arch-backdrop { transform: translate(15px, 15px); }
    }
  </style>
</head>
<body>

  <div class="background-pattern"></div>

  <div class="container">
    <section class="hero fade-in">
      <div class="hero-text">
        <h1 id="hero-name">Загрузка...</h1>
        <p id="hero-title"></p>
        <p id="about-text"></p>
      </div>
      <div class="hero-images">
        <div class="arch-backdrop"></div>
        <!-- ИСПРАВЛЕННАЯ СТРОКА С КАРТИНКОЙ -->
        <img src="photo_main.jpg" alt="Артем Гарникян" class="photo-arch" style="object-position: left;">
      </div>
    </section>

    <section class="portfolio fade-in">
      <h2 class="section-title" id="projects-title"></h2>
      <div class="grid" id="projects-grid">
        <!-- Карточки генерируются здесь -->
      </div>
    </section>
  </div>

  <footer class="fade-in">
    <div class="footer-content">
      <h2>Свяжитесь со мной</h2>
      <div class="social-links">
        <a href="https://t.me/AGroLorDikk" target="_blank" rel="noopener noreferrer">Telegram</a>
        <a href="https://vk.com/agrolordikk" target="_blank" rel="noopener noreferrer">ВКонтакте</a>
        <a href="https://instagram.com/artom_g" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); } });
    }, { threshold: 0.1 });

    fetch('content.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('hero-name').textContent = data.name;
        document.getElementById('hero-title').textContent = data.profession;
        document.getElementById('about-text').textContent = data.about_text;
        document.getElementById('projects-title').textContent = data.projects_title;

        const grid = document.getElementById('projects-grid');
        
        data.projects.forEach((project, index) => {
          const card = document.createElement('div');
          card.className = 'card fade-in'; 
          card.style.transitionDelay = `${index * 0.1}s`; 
          
          // Подготавливаем HTML для дополнительных картинок на задней стороне
          let extraImagesHtml = '';
          if (project.extra_images && project.extra_images.length > 0) {
            extraImagesHtml = '<div class="extra-images">';
            project.extra_images.forEach(imgUrl => {
              extraImagesHtml += `<img src="${imgUrl}" alt="Детали проекта">`;
            });
            extraImagesHtml += '</div>';
          }

          card.innerHTML = `
            <div class="card-inner">
              <!-- Лицевая сторона -->
              <div class="card-front">
                ${project.image ? `<img src="${project.image}" alt="${project.title}" class="card-image">` : ''}
                <div class="card-content">
                  <h3>${project.title}</h3>
                  <p>${project.desc}</p>
                  <p class="flip-hint">Нажмите подробнее ⤻</p>
                </div>
              </div>
              
              <!-- Обратная сторона -->
              <div class="card-back">
                <h4>Детали проекта</h4>
                <p>${project.extra_desc || 'Информация обновляется...'}</p>
                ${extraImagesHtml}
              </div>
            </div>
          `;

          // Добавляем логику клика для переворота карточки
          card.addEventListener('click', function() {
            this.classList.toggle('is-flipped');
          });

          grid.appendChild(card);
          observer.observe(card); 
        });
      })
      .catch(error => {
        document.getElementById('hero-name').textContent = "Ошибка загрузки";
        console.error('Ошибка:', error);
      });

    document.querySelectorAll('.fade-in').forEach(element => {
      observer.observe(element);
    });
  </script>
</body>
</html>
